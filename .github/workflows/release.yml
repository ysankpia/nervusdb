name: Release

# Triggered by pushing a `v*` tag. Publishing to a registry is irreversible — a
# version can never be overwritten and a finished release cannot be deleted — so the
# workflow is split in two:
#
#   1. `verify` runs the whole gate on the tagged commit and builds the artifacts.
#      Nothing leaves the repository.
#   2. `publish` runs only when a human dispatches it with `confirm: publish`, and it
#      is additionally gated on the `release` GitHub Environment, so the approval can
#      be required as a repository setting rather than trusted to this file.
#
# A tag alone therefore never publishes. That is the point: the tag is cheap to fix,
# a published version is not.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true
      confirm:
        description: "Type `publish` to actually publish to the registries"
        required: true
        default: "dry-run"

permissions:
  contents: write

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The gate is re-run here rather than assumed from CI: a tag can point at a
      # commit that never passed, and this is the last checkpoint before a version is
      # permanent.
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Compile (all targets)
        run: cargo check --workspace --all-targets
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Catch a version that disagrees with the tag before it is published. The
      # registry name and version are permanent once published.
      - name: The tag must match the manifest version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          manifest=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "v$manifest" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version v$manifest"
            exit 1
          fi
          echo "tag $TAG matches the manifest"

      - name: Package (validates what would be uploaded)
        run: cargo package --locked

  # One job per platform, on a **native** runner. Cross-compiling would be faster,
  # but these bindings link against the platform C runtime, and a binary built for
  # the wrong libc is exactly the kind of thing that installs cleanly and then
  # fails at import — the failure would land on a user, not on CI.
  #
  # Runner labels verified against GitHub's documented list. Note `macos-13` is
  # *not* offered for public repositories; the Intel macOS runners are
  # `macos-15-intel` / `macos-26-intel`.
  build-binaries:
    name: Build ${{ matrix.artifact }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            artifact: darwin-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: darwin-x64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          # Must match `verify`'s expression. This job has no `if:`, so it also runs
          # on a tag push, where `inputs.tag` is empty — and an empty `ref` silently
          # falls back to checkout's own default rather than naming the commit. That
          # happens to resolve to the tag today, but it is an accident of the
          # fallback, not a statement of intent, and it would stop being true if this
          # job ever gained a trigger whose default ref differs.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # --- Python wheel -----------------------------------------------------
      # `abi3-py38` is set in `bindings/python/Cargo.toml`, so one wheel per
      # platform covers Python 3.8+. That is why this matrix is platforms only,
      # not platforms × Python versions. It is also why the old single-runner
      # job was wrong: it built a Linux wheel and published it as if it were
      # everything.
      - name: Build the Python wheel
        run: |
          python -m pip install --upgrade maturin
          cd bindings/python
          maturin build --release --target ${{ matrix.target }} --out dist
          ls -l dist

      # --- Node binding -----------------------------------------------------
      # Named `nervusdb.<triple>.node`, which is what `index.js` looks for.
      - name: Build the Node binding
        run: |
          cd bindings/nodejs
          npm install
          napi build --platform --release --target ${{ matrix.target }}

          # Strip debug symbols before shipping. Measured on macOS aarch64:
          # 1.6 MB -> 1.3 MB, and four platforms ship in one package, so the
          # saving is worth four separate strip invocations. `strip` is present on
          # all four runners (Xcode CLT on macOS, binutils on Ubuntu).
          BINARY="nervusdb.${{ matrix.target }}.node"
          test -f "$BINARY" \
            || { echo "::error::napi did not produce $BINARY"; ls -l; exit 1; }
          cp "$BINARY" "$BINARY.debug"
          strip -x "$BINARY" 2>/dev/null || strip "$BINARY" || true
          ls -l "$BINARY" "$BINARY.debug"

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.artifact }}
          # Flat, with the platform in the filename, so the aggregate job can glob
          # them without untangling a directory per platform.
          path: |
            bindings/python/dist/*.whl
            bindings/nodejs/nervusdb.${{ matrix.target }}.node
          if-no-files-found: error
          retention-days: 7

  # Collect every platform's artifacts and publish. Separate from the build jobs
  # so that a failure to build one platform does not leave a half-published
  # version: both registries accept one upload per version, and a second attempt
  # for the same version is rejected permanently.
  publish-binaries:
    name: Publish the SDKs
    needs: build-binaries
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the Python wheels
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade maturin
          ls -l artifacts/*.whl
          # Every platform's wheel is uploaded together. `--skip-existing` makes a
          # re-run after a partial failure safe: the wheels that already landed are
          # skipped rather than causing an error.
          maturin upload --skip-existing artifacts/*.whl

      - name: Publish the Node package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # All four binaries ship in one package. Measured: 1.3 MB each stripped,
          # so ~5 MB unpacked — against 26 MB for better-sqlite3, which is the
          # de-facto standard for this. One package also avoids the version-drift
          # trap of the main-package-plus-platform-subpackages layout, where five
          # packages must stay in lockstep.
          mkdir -p bindings/nodejs
          cp artifacts/*.node bindings/nodejs/
          ls -l bindings/nodejs/*.node

          cd bindings/nodejs
          npm install
          npm publish --access public

  # `cargo publish` gets its own job on its own runner: crates.io accepts exactly
  # one upload per version, and a second attempt fails with "crate version already
  # uploaded" — permanently, since a published version cannot be replaced. Running
  # it in the platform matrix would fail on three of the four jobs and, worse,
  # would have uploaded successfully from whichever ran first.
  publish-crate:
    name: Publish to crates.io
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
