name: CI

on:
  # `develop` is where work happens, so it needs the same gate as `main` — otherwise
  # a broken change is only discovered at the merge, which is precisely when it is
  # most expensive to unwind.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Record the exact toolchain so a "green locally, red in CI" drift is
      # attributable. Note: a floating `stable` can introduce new lints that
      # turn a previously green tree red; if that happens, fix the lint rather
      # than pinning an older compiler.
      - name: Toolchain version
        run: |
          rustc --version
          cargo clippy --version

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Compile (all targets)
        run: cargo check --workspace --all-targets

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The edge-locality and batch suites carry throughput assertions that are
      # only meaningful in an optimised build; run them there too.
      - name: Tests (release, throughput-sensitive suites)
        run: |
          cargo test --release --test batch_tx_tests
          cargo test --release --test edge_locality_tests

  # The SDKs are `cdylib` crates: `cargo test --workspace` compiles them but has no
  # test target to run, so their end-to-end suites were never exercised in CI. They
  # are the most likely thing to break from a rename or an FFI change, and they did
  # break locally during the rename — caught by hand, which is the wrong safety net.
  sdk:
    name: SDK (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: node
            build: -p nervusdb-node
          - sdk: python
            build: -p nervusdb-python
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-sdk-${{ matrix.sdk }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-sdk-${{ matrix.sdk }}-

      - name: Build the binding
        run: cargo build ${{ matrix.build }}

      # Pin the runtime rather than taking the runner's default: the loader and the
      # napi ABI both depend on it, and "green on whatever the runner shipped this
      # week" is not a property worth having. The version lives in `.node-version`
      # so a local setup and CI read the same value.
      - uses: actions/setup-node@v7
        if: matrix.sdk == 'node'
        with:
          node-version-file: ".node-version"

      # Both bindings need the built artifact renamed to the name the runtime
      # looks for. Node's `require` only loads a `.node` file — pointing it at a
      # `.so`/`.dylib` fails with "Invalid or unexpected token", not a helpful
      # message — so the copy is mandatory, not a convenience. Verified locally by
      # removing the copy and watching the suite fail.
      - name: Run the Node.js end-to-end suite
        if: matrix.sdk == 'node'
        run: |
          node --version
          cp target/debug/libnervusdb_node.so bindings/nodejs/nervusdb.node 2>/dev/null \
            || cp target/debug/libnervusdb_node.dylib bindings/nodejs/nervusdb.node
          node bindings/nodejs/test.mjs

      - uses: actions/setup-python@v7
        if: matrix.sdk == 'python'
        with:
          python-version: "3.12"

      - name: Run the Python end-to-end suite
        if: matrix.sdk == 'python'
        run: |
          cp target/debug/libnervusdb_python.so bindings/python/nervusdb.so 2>/dev/null \
            || cp target/debug/libnervusdb_python.dylib bindings/python/nervusdb.so
          PYTHONPATH=bindings/python python3 bindings/python/tests/test_nervusdb.py

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
