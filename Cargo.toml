[workspace]
members = [".", "bindings/python", "bindings/nodejs"]

[package]
name = "graphlite-rs"
version = "1.0.0"
edition = "2021"
authors = ["GraphLite-RS Contributors"]
description = "Embedded, single-file property graph database: the SQLite model applied to graphs"
# This SPDX field reflects the open-source option only. A commercial licence is
# also available; see LICENSING.md.
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/ysankpia/graphlite"
homepage = "https://github.com/ysankpia/graphlite"
documentation = "https://docs.rs/graphlite-rs"
keywords = ["graph", "database", "sqlite", "cypher", "embedded"]
categories = ["database-implementations", "embedded-database"]

[dependencies]
# 运行时零依赖：磁盘格式的每一个字节都由本仓库自己定义与编码。
#
# 这不是洁癖。`bincode` 曾同时编码 WAL 帧与 Page 0 元数据，而它在 2025-12 停止
# 维护（作者遭遇人肉骚扰后终止项目，3.0.0 版本里只有一个编译错误和一段墓志铭）。
# 把磁盘格式的字节布局委托给第三方 crate，等于把数据库的寿命绑在别人的发布节奏上
# ——这正是 Kuzu 归档后用户被迫迁移的同一类风险。
#
# 格式因此全部手写：`codec.rs`（字节原语）、`json.rs`（输出）、`crc32.rs`（校验和）。
# Cargo.lock 中的依赖树应当为空；`tests/zero_dependency_tests.rs` 守住这条不变量。

[dev-dependencies]
# 仅用于测试的临时目录，不进最终产物。
tempfile = "3.10"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "pool_probe"
harness = false

[[bench]]
name = "mem_probe"
harness = false

# 真实数据基准（SNAP DBLP / Pokec / LiveJournal）与端到端验证工具。
#
# 放在 `benches/real_data/` 而非 `examples/`：它们不是给用户的示例，而是**性能与
# 正确性的验收手段**——只有它们能在真实规模上证明引擎没有退化。标准 `cargo bench`
# 不会自动发现子目录，因此需要逐个声明；也用它们自己的 main 驱动（`harness = false`）。
[[bench]]
name = "snap_dblp_bench"
path = "benches/real_data/snap_dblp_bench.rs"
harness = false

[[bench]]
name = "snap_pokec_bench"
path = "benches/real_data/snap_pokec_bench.rs"
harness = false

[[bench]]
name = "snap_livejournal_bench"
path = "benches/real_data/snap_livejournal_bench.rs"
harness = false

[[bench]]
name = "differential_test"
path = "benches/real_data/differential_test.rs"
harness = false

[[bench]]
name = "crash_recovery_test"
path = "benches/real_data/crash_recovery_test.rs"
harness = false

[[bench]]
name = "scale_bench"
path = "benches/real_data/scale_bench.rs"
harness = false

[lib]
name = "graphlite"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]
