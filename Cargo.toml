[workspace]
members = [".", "bindings/python", "bindings/nodejs"]

[package]
name = "graphlite-rs"
version = "0.1.0"
edition = "2021"
authors = ["GraphLite-RS Contributors"]
description = "A production-grade, embedded, single-file persistent property graph database engine in Rust"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/graphlite-rs/graphlite-rs"
homepage = "https://github.com/graphlite-rs/graphlite-rs"
documentation = "https://docs.rs/graphlite-rs"
keywords = ["graph", "database", "sqlite", "cypher", "embedded"]
categories = ["database-implementations", "embedded-database"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
crc32fast = "1.4"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "graphlite"
path = "src/main.rs"

[[bin]]
name = "graphlite-cli"
path = "src/bin/cli.rs"

[lib]
name = "graphlite"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]
