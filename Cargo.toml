[workspace]
members = [".", "bindings/python", "bindings/nodejs"]

[package]
name = "nervusdb"
version = "0.1.0"
edition = "2021"
authors = ["NervusDB Contributors"]
description = "Embedded, single-file property graph database: the SQLite model applied to graphs"
# This SPDX field reflects the open-source option only. A commercial licence is
# also available; see LICENSING.md.
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/ysankpia/nervusdb"
homepage = "https://github.com/ysankpia/nervusdb"
documentation = "https://docs.rs/nervusdb"
keywords = ["graph", "database", "sqlite", "cypher", "embedded"]
categories = ["database-implementations", "embedded-database"]
# `.cargo/config.toml` 是**本仓库的开发配置**，不进发布包。
#
# 它给 macOS 目标加了 `-undefined dynamic_lookup`：pyo3 的 `extension-module`
# cdylib 刻意不链接 libpython（符号留到运行时由解释器提供），因此没有这两个标志时
# `nervusdb-python` 链接失败——实测 `cargo build --workspace --release` 报
# `ld: symbol(s) not found for architecture arm64`。所以它必须留在仓库里。
#
# 但它对**下游**没有用处：实测 cargo 不读取依赖包的 `.cargo/config.toml`
# （把一个故意写坏的 rustflags 放进依赖目录，宿主仍然构建成功）。留在包里只会让
# `cargo add nervusdb` 的人在自己的 `~/.cargo/registry` 里看到一条属于作者的配置。
exclude = [".cargo/config.toml"]

[dependencies]
# 运行时零依赖：磁盘格式的每一个字节都由本仓库自己定义与编码。
#
# 这不是洁癖。`bincode` 曾同时编码 WAL 帧与 Page 0 元数据，而它在 2025-12 停止
# 维护（作者遭遇人肉骚扰后终止项目，3.0.0 版本里只有一个编译错误和一段墓志铭）。
# 把磁盘格式的字节布局委托给第三方 crate，等于把数据库的寿命绑在别人的发布节奏上
# ——这正是 Kuzu 归档后用户被迫迁移的同一类风险。
#
# 格式因此全部手写：`codec.rs`（字节原语）、`json.rs`（输出）、`crc32.rs`（校验和）。
#
# 这条不变量精确地是「**这个库**没有运行时依赖」，不是「Cargo.lock 是空的」。
# 实测：`cargo tree -p nervusdb --edges normal` 只输出 nervusdb 自己一行；lock 里的
# 几十条条目全部来自 **bindings**（pyo3 与 napi 的依赖树），它们是与本 crate 不同的
# 包。把不变量写成「lock 为空」会让人以为可以拿 lock 的行数来判断，而那个判断会
# 因为绑定升级而误报。
# `tests/zero_dependency_tests.rs` 守住这条不变量：它扫描 `src/` 是否引用任何外部
# crate，而不是数 lock 条目。

[dev-dependencies]
# 仅用于测试的临时目录，不进最终产物。
tempfile = "3.10"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "pool_probe"
harness = false

[[bench]]
name = "mem_probe"
harness = false

# 真实数据基准（SNAP DBLP / Pokec / LiveJournal）与端到端验证工具。
#
# 放在 `benches/real_data/` 而非 `examples/`：它们不是给用户的示例，而是**性能与
# 正确性的验收手段**——只有它们能在真实规模上证明引擎没有退化。标准 `cargo bench`
# 不会自动发现子目录，因此需要逐个声明；也用它们自己的 main 驱动（`harness = false`）。
[[bench]]
name = "snap_dblp_bench"
path = "benches/real_data/snap_dblp_bench.rs"
harness = false

[[bench]]
name = "snap_pokec_bench"
path = "benches/real_data/snap_pokec_bench.rs"
harness = false

[[bench]]
name = "snap_livejournal_bench"
path = "benches/real_data/snap_livejournal_bench.rs"
harness = false

[[bench]]
name = "differential_test"
path = "benches/real_data/differential_test.rs"
harness = false

[[bench]]
name = "crash_recovery_test"
path = "benches/real_data/crash_recovery_test.rs"
harness = false

# #12 的复现/验证基准：通过非起点变量连接的多模式查询（「共同邻居」形态）。
[[bench]]
name = "join_shape_bench"
path = "benches/real_data/join_shape_bench.rs"
harness = false

# 读扩展性基准：用合成图复现「读吞吐随线程数下降」，因此不依赖 SNAP 数据集。
[[bench]]
name = "concurrency_scaling_bench"
path = "benches/real_data/concurrency_scaling_bench.rs"
harness = false

[[bench]]
name = "scale_bench"
path = "benches/real_data/scale_bench.rs"
harness = false

# Cypher 模糊测试：随机查询 vs 独立内存模型。已有的 differential_test 只对拍**写**
# 操作，查询本身从未被对拍——而 `has_cycle` 的假阳性说明缺陷藏在没人构造过的形状里，
# 查询的形状空间比读写大得多。可长跑，失败时输出可复现的种子。
[[bench]]
name = "cypher_fuzz_bench"
path = "benches/real_data/cypher_fuzz_bench.rs"
harness = false

# 故障注入：磁盘满、权限、截断、WAL 丢失。这些**外部故障**此前几乎没测过，而它们
# 正是「静默数据错误」最集中的地方——写失败若被折叠成「成功」，用户几周后才发现。
# 判据不只是「返回 Err」，还有「失败的写不得污染已提交数据」「故障解除后完全可用」。
[[bench]]
name = "fault_injection_bench"
path = "benches/real_data/fault_injection_bench.rs"
harness = false

[lib]
name = "nervusdb"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]
