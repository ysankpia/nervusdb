<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GraphLite Studio</title>
    <!--
  刻意不引用任何 CDN：这个页面必须能离线工作。
  一个本地数据库工具在飞机上打不开自己的界面，是荒谬的。
-->
    <style>
      :root {
        --bg: #14161a;
        --panel: #1c1f26;
        --border: #2c313a;
        --text: #dfe3ea;
        --dim: #8b94a3;
        --accent: #6ea8fe;
        --warn: #e0b341;
        --err: #e06c75;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: grid;
        grid-template-columns: 280px 1fr 300px;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.5 -apple-system,
          "Segoe UI",
          system-ui,
          sans-serif;
        overflow: hidden;
      }
      aside {
        background: var(--panel);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding: 14px;
      }
      aside:last-child {
        border-right: none;
        border-left: 1px solid var(--border);
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
        letter-spacing: 0.3px;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--dim);
        margin: 18px 0 8px;
        font-weight: 600;
      }
      h2:first-child {
        margin-top: 0;
      }
      #canvas-wrap {
        position: relative;
        background: #0f1115;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      canvas.dragging {
        cursor: grabbing;
      }

      .stat {
        display: flex;
        justify-content: space-between;
        padding: 3px 0;
      }
      .stat b {
        font-weight: 600;
      }

      button,
      input[type="text"] {
        width: 100%;
        background: #232833;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 9px;
        font: inherit;
        margin-bottom: 6px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.primary {
        background: #2b3d5e;
        border-color: #3d5party;
      }
      button.primary {
        background: #2b3d5e;
        border-color: #3d5680;
      }

      label.legend {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 3px 0;
        cursor: pointer;
        user-select: none;
      }
      label.legend input {
        margin: 0;
        accent-color: var(--accent);
      }
      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
      }
      .legend .count {
        margin-left: auto;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }

      #props {
        font-size: 12px;
      }
      #props pre {
        background: #12141a;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px;
        overflow-x: auto;
        margin: 6px 0 0;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .pill {
        display: inline-block;
        background: #232833;
        border-radius: 10px;
        padding: 1px 8px;
        margin: 0 4px 4px 0;
        font-size: 11px;
      }

      #cypher-out {
        margin-top: 8px;
        max-height: 40vh;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      th,
      td {
        text-align: left;
        padding: 4px 6px;
        border-bottom: 1px solid var(--border);
      }
      th {
        color: var(--dim);
        font-weight: 600;
        position: sticky;
        top: 0;
        background: var(--panel);
      }

      .msg {
        padding: 8px;
        border-radius: 6px;
        margin-bottom: 8px;
        font-size: 12px;
      }
      .msg.warn {
        background: #3a3016;
        color: var(--warn);
      }
      .msg.err {
        background: #3a1e21;
        color: var(--err);
      }
      .hint {
        color: var(--dim);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>GraphLite Studio</h1>
      <div class="hint" id="db-path">…</div>

      <h2>Overview</h2>
      <div class="stat"><span>Nodes</span><b id="s-nodes">—</b></div>
      <div class="stat"><span>Edges</span><b id="s-edges">—</b></div>
      <div class="stat"><span>Showing</span><b id="s-shown">—</b></div>
      <div class="stat"><span>Mode</span><b id="s-mode">—</b></div>

      <h2>View</h2>
      <div id="view-controls">
        <button id="btn-reload">Reload graph</button>
        <button id="btn-fit">Fit to view</button>
        <button id="btn-freeze">Freeze layout</button>
      </div>

      <h2>Limit</h2>
      <input type="text" id="limit" value="300" aria-label="Node limit" />
      <div class="hint">
        Larger limits render slowly. The server refuses above 5000.
      </div>

      <div id="notes"></div>
    </aside>

    <div id="canvas-wrap">
      <canvas id="c"></canvas>
    </div>

    <aside>
      <h2>Selection</h2>
      <div id="props"><div class="hint">Click a node to inspect it.</div></div>

      <h2>Labels</h2>
      <div id="labels"></div>

      <h2>Cypher</h2>
      <input
        type="text"
        id="q"
        placeholder="MATCH (n) RETURN n LIMIT 10"
        aria-label="Cypher query"
      />
      <button id="btn-run" class="primary">Run (read-only)</button>
      <div id="cypher-out"></div>
    </aside>

    <script>
      "use strict";

      // ── 状态 ────────────────────────────────────────────────────────────────
      const state = {
        nodes: [], // {id, labels, properties, x, y, vx, vy, fixed}
        edges: [], // {id, src, dst, type}
        index: new Map(), // node id -> node object
        hiddenLabels: new Set(),
        selected: null,
        frozen: false,
        hover: null,
        view: { x: 0, y: 0, scale: 1 },
      };

      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      // 标签配色：从字符串稳定派生，同一标签在任何一次运行里颜色一致。
      // 用哈希而非索引，是因为集合的迭代顺序不保证稳定。
      const PALETTE = [
        "#6ea8fe",
        "#7bc98a",
        "#e0b341",
        "#d98cd9",
        "#e08c6c",
        "#6cd9d0",
        "#a08cf0",
        "#c9d96c",
      ];
      function colorFor(label) {
        let h = 0;
        for (let i = 0; i < label.length; i++)
          h = (h * 31 + label.charCodeAt(i)) >>> 0;
        return PALETTE[h % PALETTE.length];
      }
      function nodeColor(n) {
        return n.labels.length ? colorFor(n.labels[0]) : "#6b7280";
      }

      // ── 尺寸 ────────────────────────────────────────────────────────────────
      function resize() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        canvas.style.width = rect.width + "px";
        canvas.style.height = rect.height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener("resize", resize);

      // ── 力导向布局 ──────────────────────────────────────────────────────────
      // 斥力原本是 O(n²)：2000 个节点每帧 400 万次距离计算，直接卡死。
      // 按网格分桶后只与相邻 9 格互斥，接近 O(n)。
      const CELL = 70,
        REPULSION = 5200,
        SPRING = 0.012,
        SPRING_LEN = 70,
        DAMPING = 0.86;

      function step() {
        if (state.frozen) return;
        const nodes = state.nodes.filter((n) => !isHidden(n));
        const byId = new Map(nodes.map((n) => [n.id, n]));

        // 建格
        const grid = new Map();
        for (const n of nodes) {
          const k = Math.floor(n.x / CELL) + "," + Math.floor(n.y / CELL);
          let bucket = grid.get(k);
          if (!bucket) {
            bucket = [];
            grid.set(k, bucket);
          }
          bucket.push(n);
        }

        // 斥力：只算邻近 9 格
        for (const n of nodes) {
          const cx = Math.floor(n.x / CELL),
            cy = Math.floor(n.y / CELL);
          for (let dx = -1; dx <= 1; dx++) {
            for (let dy = -1; dy <= 1; dy++) {
              const bucket = grid.get(cx + dx + "," + (cy + dy));
              if (!bucket) continue;
              for (const m of bucket) {
                if (m === n) continue;
                let ex = n.x - m.x,
                  ey = n.y - m.y;
                let d2 = ex * ex + ey * ey;
                if (d2 < 0.01) {
                  d2 = 0.01;
                  ex = Math.random() - 0.5;
                  ey = Math.random() - 0.5;
                }
                const f = REPULSION / d2;
                const d = Math.sqrt(d2);
                n.vx += (ex / d) * f * 0.001;
                n.vy += (ey / d) * f * 0.001;
              }
            }
          }
        }

        // 弹簧
        for (const e of state.edges) {
          const a = byId.get(e.src),
            b = byId.get(e.dst);
          if (!a || !b) continue;
          const dx = b.x - a.x,
            dy = b.y - a.y;
          const d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
          const f = (d - SPRING_LEN) * SPRING;
          const ux = dx / d,
            uy = dy / d;
          a.vx += ux * f;
          a.vy += uy * f;
          b.vx -= ux * f;
          b.vy -= uy * f;
        }

        // 向心：防止孤立节点飘到无穷远
        for (const n of nodes) {
          n.vx -= n.x * 0.0008;
          n.vy -= n.y * 0.0008;
          if (n.fixed) {
            n.vx = 0;
            n.vy = 0;
            continue;
          }
          n.vx *= DAMPING;
          n.vy *= DAMPING;
          // 限速：一次大跳会让布局炸开
          const sp = Math.hypot(n.vx, n.vy);
          if (sp > 12) {
            n.vx *= 12 / sp;
            n.vy *= 12 / sp;
          }
          n.x += n.vx;
          n.y += n.vy;
        }
      }

      // ── 渲染 ────────────────────────────────────────────────────────────────
      function isHidden(n) {
        return n.labels.some((l) => state.hiddenLabels.has(l));
      }

      function draw() {
        const w = canvas.width / (window.devicePixelRatio || 1);
        const h = canvas.height / (window.devicePixelRatio || 1);
        ctx.clearRect(0, 0, w, h);

        ctx.save();
        ctx.translate(w / 2 + state.view.x, h / 2 + state.view.y);
        ctx.scale(state.view.scale, state.view.scale);

        const visible = state.nodes.filter((n) => !isHidden(n));
        const byId = new Map(visible.map((n) => [n.id, n]));

        // 边
        ctx.lineWidth = 1 / state.view.scale;
        ctx.strokeStyle = "#3a4150";
        ctx.beginPath();
        for (const e of state.edges) {
          const a = byId.get(e.src),
            b = byId.get(e.dst);
          if (!a || !b) continue;
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
        }
        ctx.stroke();

        // 节点
        const R = 7;
        for (const n of visible) {
          ctx.beginPath();
          ctx.arc(n.x, n.y, R, 0, Math.PI * 2);
          ctx.fillStyle = nodeColor(n);
          ctx.fill();
          if (state.selected === n.id) {
            ctx.lineWidth = 2.5 / state.view.scale;
            ctx.strokeStyle = "#fff";
            ctx.stroke();
          }
        }

        // 标签：只在缩放足够大、或节点不多时画，避免糊成一团
        if (state.view.scale > 0.55 && visible.length <= 400) {
          ctx.font = 11 / state.view.scale + "px system-ui, sans-serif";
          ctx.fillStyle = "#aab2c0";
          ctx.textAlign = "center";
          for (const n of visible) {
            const name =
              n.properties && (n.properties.name ?? n.properties.idx);
            if (name !== undefined)
              ctx.fillText(String(name), n.x, n.y - R - 4);
          }
        }
        ctx.restore();
      }

      let rafId = null;
      function tick() {
        step();
        draw();
        rafId = requestAnimationFrame(tick);
      }

      function fit() {
        const visible = state.nodes.filter((n) => !isHidden(n));
        if (!visible.length) return;
        let minX = Infinity,
          maxX = -Infinity,
          minY = Infinity,
          maxY = -Infinity;
        for (const n of visible) {
          minX = Math.min(minX, n.x);
          maxX = Math.max(maxX, n.x);
          minY = Math.min(minY, n.y);
          maxY = Math.max(maxY, n.y);
        }
        const w = canvas.width / (window.devicePixelRatio || 1);
        const h = canvas.height / (window.devicePixelRatio || 1);
        const spanX = Math.max(1, maxX - minX),
          spanY = Math.max(1, maxY - minY);
        state.view.scale = Math.min(w / (spanX + 120), h / (spanY + 120), 2);
        state.view.x = -((minX + maxX) / 2) * state.view.scale;
        state.view.y = -((minY + maxY) / 2) * state.view.scale;
      }

      // ── 交互：拖拽、平移、缩放、选择 ────────────────────────────────────────
      function toWorld(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const w = rect.width,
          h = rect.height;
        return {
          x: (clientX - rect.left - w / 2 - state.view.x) / state.view.scale,
          y: (clientY - rect.top - h / 2 - state.view.y) / state.view.scale,
        };
      }

      function hitTest(p) {
        const R = 10 / state.view.scale;
        for (let i = state.nodes.length - 1; i >= 0; i--) {
          const n = state.nodes[i];
          if (isHidden(n)) continue;
          if (Math.hypot(n.x - p.x, n.y - p.y) <= R) return n;
        }
        return null;
      }

      let dragging = null,
        panning = null;

      canvas.addEventListener("mousedown", (e) => {
        const p = toWorld(e.clientX, e.clientY);
        const n = hitTest(p);
        if (n) {
          dragging = n;
          n.fixed = true;
          canvas.classList.add("dragging");
        } else {
          panning = {
            x: e.clientX - state.view.x,
            y: e.clientY - state.view.y,
          };
          canvas.classList.add("dragging");
        }
      });

      canvas.addEventListener("mousemove", (e) => {
        if (dragging) {
          const p = toWorld(e.clientX, e.clientY);
          dragging.x = p.x;
          dragging.y = p.y;
          dragging.vx = 0;
          dragging.vy = 0;
        } else if (panning) {
          state.view.x = e.clientX - panning.x;
          state.view.y = e.clientY - panning.y;
        }
      });

      canvas.addEventListener("mouseup", () => {
        if (dragging) {
          dragging.fixed = false;
          dragging = null;
        }
        panning = null;
        canvas.classList.remove("dragging");
      });

      canvas.addEventListener("click", (e) => {
        // 只有没拖动过才当作选择：否则每次拖拽结束都会顺带选中
        if (panning || dragging) return;
        const n = hitTest(toWorld(e.clientX, e.clientY));
        select(n ? n.id : null);
      });

      canvas.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const before = toWorld(e.clientX, e.clientY);
          const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
          state.view.scale = Math.min(
            4,
            Math.max(0.08, state.view.scale * factor),
          );
          const after = toWorld(e.clientX, e.clientY);
          // 保持光标下的世界坐标不动，缩放才不会「跑掉」
          state.view.x += (after.x - before.x) * state.view.scale;
          state.view.y += (after.y - before.y) * state.view.scale;
        },
        { passive: false },
      );

      function select(id) {
        state.selected = id;
        const box = document.getElementById("props");
        if (id === null) {
          box.innerHTML = '<div class="hint">Click a node to inspect it.</div>';
          return;
        }
        const n = state.index.get(id);
        if (!n) return;
        const pills = n.labels
          .map((l) => `<span class="pill">:${escapeHtml(l)}</span>`)
          .join("");
        const json = JSON.stringify(n.properties ?? {}, null, 2);
        box.innerHTML = `<div><b>#${n.id}</b> ${pills}</div><pre>${escapeHtml(json)}</pre>`;
      }

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      // ── 加载 ────────────────────────────────────────────────────────────────
      async function loadStats() {
        try {
          const s = await (await fetch("/api/stats")).json();
          document.getElementById("s-nodes").textContent =
            s.nodes.toLocaleString();
          document.getElementById("s-edges").textContent =
            s.edges.toLocaleString();
          document.getElementById("s-mode").textContent = s.read_only
            ? "read-only"
            : "read-write";
        } catch (e) {
          /* 统计失败不影响主视图 */
        }
      }

      async function loadGraph() {
        const limit = document.getElementById("limit").value.trim() || "300";
        const notes = document.getElementById("notes");
        notes.innerHTML = "";

        let data;
        try {
          const res = await fetch(
            "/api/graph?limit=" + encodeURIComponent(limit),
          );
          data = await res.json();
        } catch (e) {
          notes.innerHTML = `<div class="msg err">Failed to load: ${escapeHtml(e)}</div>`;
          return;
        }
        if (data.error) {
          notes.innerHTML = `<div class="msg err">${escapeHtml(data.error)}</div>`;
          return;
        }

        const cx = canvas.width / (window.devicePixelRatio || 1) / 2;
        const cy = canvas.height / (window.devicePixelRatio || 1) / 2;

        state.nodes = data.nodes.map((n) => ({
          ...n,
          // 初始位置用黄金角螺旋：比随机撒点收敛快得多，也不会一开始就叠在一起
          x: cx + Math.cos(n.id * 2.399) * 40 * Math.sqrt(n.id % 50),
          y: cy + Math.sin(n.id * 2.399) * 40 * Math.sqrt(n.id % 50),
          vx: 0,
          vy: 0,
          fixed: false,
        }));
        state.edges = data.edges;
        state.index = new Map(state.nodes.map((n) => [n.id, n]));
        state.selected = null;
        select(null);

        document.getElementById("s-shown").textContent =
          `${state.nodes.length} / ${data.total_nodes.toLocaleString()}`;
        if (data.truncated) {
          notes.innerHTML =
            `<div class="msg warn">Showing the first ${state.nodes.length} of ` +
            `${data.total_nodes.toLocaleString()} nodes. A graph this size would not be readable ` +
            `if drawn in full — narrow the query instead of raising the limit.</div>`;
        }

        renderLabels();
        fit();
      }

      function renderLabels() {
        const counts = new Map();
        for (const n of state.nodes) {
          const key = n.labels.length ? n.labels[0] : "(no label)";
          counts.set(key, (counts.get(key) || 0) + 1);
        }
        const box = document.getElementById("labels");
        if (!counts.size) {
          box.innerHTML = '<div class="hint">No nodes.</div>';
          return;
        }
        const rows = [...counts.entries()]
          .sort((a, b) => b[1] - a[1])
          .map(([label, count]) => {
            const color = label === "(no label)" ? "#6b7280" : colorFor(label);
            return `<label class="legend">
      <input type="checkbox" data-label="${escapeHtml(label)}" checked>
      <span class="swatch" style="background:${color}"></span>
      <span>${escapeHtml(label)}</span>
      <span class="count">${count}</span>
    </label>`;
          })
          .join("");
        box.innerHTML = rows;
        box.querySelectorAll("input[type=checkbox]").forEach((cb) => {
          cb.addEventListener("change", () => {
            const label = cb.dataset.label;
            if (cb.checked) state.hiddenLabels.delete(label);
            else state.hiddenLabels.add(label);
          });
        });
      }

      // ── Cypher 控制台 ───────────────────────────────────────────────────────
      async function runQuery() {
        const out = document.getElementById("cypher-out");
        const q = document.getElementById("q").value.trim();
        if (!q) return;
        out.innerHTML = '<div class="hint">Running…</div>';
        try {
          const res = await fetch("/api/query?q=" + encodeURIComponent(q));
          const data = await res.json();
          if (data.error) {
            out.innerHTML = `<div class="msg err">${escapeHtml(data.error)}</div>`;
            return;
          }
          if (!data.rows.length) {
            out.innerHTML = '<div class="msg warn">No rows.</div>';
            return;
          }
          const head = data.columns
            .map((c) => `<th>${escapeHtml(c)}</th>`)
            .join("");
          const body = data.rows
            .map(
              (r) =>
                "<tr>" +
                r.map((c) => `<td>${escapeHtml(c)}</td>`).join("") +
                "</tr>",
            )
            .join("");
          out.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
        } catch (e) {
          out.innerHTML = `<div class="msg err">${escapeHtml(e)}</div>`;
        }
      }

      // ── 绑定 ────────────────────────────────────────────────────────────────
      document
        .getElementById("btn-reload")
        .addEventListener("click", loadGraph);
      document.getElementById("btn-fit").addEventListener("click", fit);
      document.getElementById("btn-freeze").addEventListener("click", (e) => {
        state.frozen = !state.frozen;
        e.target.textContent = state.frozen ? "Resume layout" : "Freeze layout";
      });
      document.getElementById("btn-run").addEventListener("click", runQuery);
      document.getElementById("q").addEventListener("keydown", (e) => {
        if (e.key === "Enter") runQuery();
      });

      document.getElementById("db-path").textContent = location.host;

      resize();
