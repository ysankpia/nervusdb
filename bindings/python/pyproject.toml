[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "graphlite"
version = "1.0.0-rc.2"
description = "Python bindings for GraphLite-RS, an embedded single-file property graph database"
readme = "README.md"
authors = [{ name = "GraphLite-RS Contributors" }]
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.8"
keywords = ["graph", "database", "sqlite", "cypher", "embedded"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]

[tool.maturin]
module-name = "graphlite"
features = ["pyo3/extension-module"]
