[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
# 分发名（PyPI）与导入模块名刻意不同：
#   - PyPI 上的 `graphlite` 已被另一个嵌入式图数据库占用（eugene-eeo/graphlite），
#     用它发布会让用户装到别人的包，且无法撤回。
#   - `graphlite-rs` 在 crates.io / PyPI / npm 三处均可用（2026-09-13 实测）。
#   - 导入名仍是 `graphlite`（见下方 `[tool.maturin] module-name`），因此
#     `import graphlite` 不变——这是 `beautifulsoup4` → `import bs4` 的标准做法。
name = "graphlite-rs"
version = "1.1.0"
description = "Python bindings for GraphLite-RS, an embedded single-file property graph database"
readme = "README.md"
authors = [{ name = "GraphLite-RS Contributors" }]
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.8"
keywords = ["graph", "database", "sqlite", "cypher", "embedded"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]

[tool.maturin]
module-name = "graphlite"
features = ["pyo3/extension-module"]
