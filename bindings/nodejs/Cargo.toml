[package]
name = "graphlite-node"
version = "1.0.0-rc.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
graphlite_core = { package = "graphlite-rs", path = "../../" }
napi = { version = "2.16", default-features = false, features = [
  "napi4",
  "serde-json",
] }
napi-derive = "2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.1"
